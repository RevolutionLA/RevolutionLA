name: Generate metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # Bot commits land in image/generated; ignoring them keeps the loop finite.
      - "image/generated/**"

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics-left:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: General metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: image/generated/metrics.left.svg
          committer_branch: main
          base: header, activity, metadata
          config_timezone: Asia/Shanghai

  metrics-right:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Iso calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: image/generated/metrics.right.svg
          committer_branch: main
          base: ""
          plugin_isocalendar: yes
          config_timezone: Asia/Shanghai
