name: Generate metrics

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics-left:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: General metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: metrics.left.svg
          committer_branch: output
          base: header, activity, metadata
          config_timezone: Asia/Shanghai

  metrics-right:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Iso calendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN || github.token }}
          user: ${{ github.repository_owner }}
          filename: metrics.right.svg
          committer_branch: output
          base: ""
          plugin_isocalendar: yes
          config_timezone: Asia/Shanghai
