name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      # The bot commit only touches this folder; without the ignore every run
      # would trigger the next one.
      - "image/generated/**"

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Commit into image/generated on main
        run: |
          mkdir -p image/generated
          cp dist/snake.svg dist/snake-dark.svg image/generated/
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage first: `git diff --quiet` only sees tracked files, so on the first
          # run it read the freshly copied SVGs as "no change" and exited 0 without
          # committing anything.
          git add image/generated
          if git diff --cached --quiet; then
            echo "no change today"
            exit 0
          fi
          git commit -m "chore(snake): refresh contribution grid replay [skip ci]"
          git push origin main
